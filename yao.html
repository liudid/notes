<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .a {
        position: relative;
        width: 400px;
        height: 400px;
        border: 1px solid #d32f2f;
        padding: 20px 20px 20px 100px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 20px;
        margin: 100px auto;
      }
      .b,
      .c {
        position: relative;
        display: flex;
        flex: 1;
        border: 1px dashed #d32f2f;
        gap: 30px;
        flex-direction: column;
        padding: 16px;
        padding-right: 100px;
      }
      .b-1,
      .b-2,
      .b-3,
      .c-1,
      .c-2,
      .c-3 {
        position: relative;
        flex: 1;
        border: 1px solid #d32f2f;
      }
      .guide {
        position: absolute;
        top: 50%;
        left: -100px;
        transform: translateY(-50%);
        color: #d32f2f;
      }
      .h {
        font-size: 16px;
        position: absolute;
        top: 50%;
        right: -50px;
        transform: translateY(-50%);
        color: #d32f2f;
      }
      .p {
        font-size: 14px;
        position: absolute;
        top: 50%;
        right: -90px;
        transform: translateY(-50%);
        color: #d32f2f;
      }
      .z-1 {
        position: absolute;
        top: 20px;
        right: 70px;
        font-size: 16px;
        color: #d32f2f;
        font-weight: bold;
      }
      .z-2 {
        position: absolute;
        top: 20px;
        right: 24px;
        font-size: 14px;
        font-weight: bold;
        color: #d32f2f;
      }
    </style>
  </head>
  <body>
    <div class="a">
      <div class="z">
        <div class="z-1">爻位</div>
        <div class="z-2">位属性</div>
      </div>
      <div class="b">
        <div class="b-1">
          <div class="h">上爻</div>
          <div class="p">阴位</div>
        </div>
        <div class="b-2">
          <div class="h">五爻</div>
          <div class="p">阳位</div>
        </div>
        <div class="b-3">
          <div class="h">四爻</div>
          <div class="p">阴位</div>
        </div>
        <div class="guide">上卦（外卦）</div>
      </div>
      <div class="c">
        <div class="c-1">
          <div class="h">三爻</div>
          <div class="p">阳位</div>
        </div>
        <div class="c-2">
          <div class="h">二爻</div>
          <div class="p">阴位</div>
        </div>
        <div class="c-3">
          <div class="h">初爻</div>
          <div class="p">阳位</div>
        </div>
        <div class="guide">下卦（内卦）</div>
      </div>
    </div>
  </body>
</html>
