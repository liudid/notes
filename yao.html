<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>爻的「比」关系</title>
    <style>
      :root {
        --bg: #ffffff;
        --bg-soft: #f6f6f7;
        --text-1: #213547;
        --text-2: #476582;
        --text-3: #8a9aa9;
        --divider: #e2e2e3;
        --stroke: #3a4a5a;
        --support: #2f9e68;
        --support-soft: rgba(47, 158, 104, 0.12);
        --ride: #e0733a;
        --ride-soft: rgba(224, 115, 58, 0.12);
        --hostile: #9aa5b1;
        --hostile-soft: rgba(154, 165, 177, 0.14);

        --label-w: 3.5rem;
        --rail-w: 84px;
        --line-x: 40px;
        --glyph-w: 168px;
        --yao-h: 46px;
        --gap-h: 36px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1b1f;
          --bg-soft: #242429;
          --text-1: #dfdfd6;
          --text-2: #a8b1bb;
          --text-3: #7c8794;
          --divider: #2e2e32;
          --stroke: #c8d2dc;
          --support: #4ade80;
          --support-soft: rgba(74, 222, 128, 0.14);
          --ride: #fb923c;
          --ride-soft: rgba(251, 146, 60, 0.14);
          --hostile: #7c8794;
          --hostile-soft: rgba(124, 135, 148, 0.18);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px 24px 72px;
        background: var(--bg);
        color: var(--text-1);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }

      [v-cloak] {
        display: none;
      }

      .wrap {
        max-width: 880px;
        margin: 0 auto;
      }

      h1 {
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 8px;
        letter-spacing: 0.02em;
      }

      .lede {
        margin: 0 0 6px;
        font-size: 14px;
        color: var(--text-2);
      }

      .footnote {
        margin: 0;
        font-size: 12px;
        color: var(--text-3);
      }

      /* ---------- 卦切换 ---------- */

      .switcher {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 24px 0 18px;
      }

      .switcher button {
        font: inherit;
        font-size: 13px;
        padding: 6px 14px;
        border: 1px solid var(--divider);
        border-radius: 999px;
        background: transparent;
        color: var(--text-2);
        cursor: pointer;
        transition: all 0.18s ease;
      }

      .switcher button:hover {
        border-color: var(--text-3);
        color: var(--text-1);
      }

      .switcher button.is-on {
        border-color: var(--text-1);
        background: var(--text-1);
        color: var(--bg);
      }

      .switcher .tag {
        margin-left: 6px;
        opacity: 0.72;
        font-size: 12px;
      }

      /* ---------- 卦头 ---------- */

      .hex-head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--divider);
      }

      .hex-symbol {
        font-size: 40px;
        line-height: 1;
        flex: none;
      }

      .hex-title {
        font-size: 18px;
        font-weight: 600;
      }

      .hex-guaci {
        font-size: 13px;
        color: var(--text-3);
      }

      /* ---------- 工具条 ---------- */

      .toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 18px;
        margin: 18px 0 4px;
      }

      .play-btn {
        font: inherit;
        font-size: 13px;
        padding: 6px 16px;
        border: 1px solid var(--text-2);
        border-radius: 6px;
        background: transparent;
        color: var(--text-1);
        cursor: pointer;
        transition: all 0.18s ease;
      }

      .play-btn:hover {
        background: var(--bg-soft);
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        font-size: 12px;
        color: var(--text-2);
      }

      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .legend i {
        width: 22px;
        display: inline-block;
      }

      .legend i.support {
        border-top: 2px solid var(--support);
      }

      .legend i.ride {
        border-top: 2px solid var(--ride);
      }

      .legend i.hostile {
        border-top: 2px dashed var(--hostile);
      }

      /* ---------- 卦象盘 ---------- */

      .board {
        margin: 14px 0 0;
        user-select: none;
      }

      .row {
        display: grid;
        grid-template-columns: var(--label-w) var(--rail-w) var(--glyph-w) 1fr;
        align-items: center;
        column-gap: 12px;
      }

      .row.yao {
        height: var(--yao-h);
        cursor: pointer;
        transition: opacity 0.28s ease;
      }

      .row.gap {
        height: var(--gap-h);
        grid-template-columns: var(--label-w) var(--rail-w) 1fr;
      }

      .row.yao:focus-visible,
      .link .badge:focus-visible {
        outline: 2px solid var(--text-2);
        outline-offset: 3px;
        border-radius: 4px;
      }

      .label {
        font-size: 13px;
        color: var(--text-3);
        letter-spacing: 0.06em;
        transition: color 0.2s ease;
      }

      .rail {
        position: relative;
        height: 100%;
      }

      .glyph {
        display: flex;
        align-items: center;
        gap: 18px;
        height: 100%;
        max-width: 300px;
      }

      .glyph .bar {
        flex: 1;
        height: 12px;
        border-radius: 2px;
        background: var(--stroke);
        transition: box-shadow 0.24s ease;
      }

      .yao-text {
        font-size: 12px;
        color: var(--text-3);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition: color 0.2s ease;
      }

      /* 爻的高亮 / 淡出 */

      .row.yao.is-dim {
        opacity: 0.25;
      }

      .row.yao.is-self .label,
      .row.yao.is-neighbor .label {
        color: var(--text-1);
        font-weight: 600;
      }

      .row.yao.is-self .yao-text {
        color: var(--text-1);
      }

      .row.yao.is-self .bar {
        box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text-1);
      }

      .row.yao.is-neighbor .bar {
        box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--text-3);
      }

      /* ---------- 关系连接件（括号形）---------- */

      .link {
        position: absolute;
        /* 上下各探出半个爻行，使竖线正好从下爻中心连到上爻中心 */
        top: calc(var(--yao-h) / -2);
        height: calc(var(--gap-h) + var(--yao-h));
        left: 0;
        right: -12px; /* 越过列间距，贴到爻画 */
        transition: opacity 0.28s ease;
        color: var(--hostile);
      }

      .link.support {
        color: var(--support);
      }

      .link.ride {
        color: var(--ride);
      }

      .link .line {
        position: absolute;
        left: var(--line-x);
        top: 1px;
        bottom: 1px;
        border-left: 2px solid currentColor;
        transition: border-left-width 0.24s ease;
      }

      .link.hostile .line {
        border-left-style: dashed;
      }

      .link .arm {
        position: absolute;
        left: var(--line-x);
        right: 0;
        border-top: 2px solid currentColor;
        opacity: 0.85;
        transition: opacity 0.24s ease, border-top-width 0.24s ease;
      }

      .link.hostile .arm {
        border-top-style: dashed;
      }

      .link .arm.top {
        top: 0;
      }

      .link .arm.bottom {
        bottom: 0;
      }

      .link .badge {
        position: absolute;
        left: var(--line-x);
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 12px;
        line-height: 1;
        padding: 4px 9px;
        border-radius: 999px;
        border: 1px solid currentColor;
        background: var(--bg);
        color: currentColor;
        white-space: nowrap;
        cursor: pointer;
        transition: transform 0.24s ease, background 0.24s ease,
          color 0.24s ease;
      }

      .link.is-dim {
        opacity: 0.2;
      }

      .link.is-on .line,
      .link.is-on .arm {
        border-width: 3px;
      }

      .link.is-on .arm {
        opacity: 1;
      }

      /* 徽章点亮时底色用关系色、文字反底色 */
      .link.is-on .badge {
        font-weight: 600;
        transform: translate(-50%, -50%) scale(1.12);
        color: var(--bg);
      }

      .link.is-on.support .badge {
        background: var(--support);
        border-color: var(--support);
      }

      .link.is-on.ride .badge {
        background: var(--ride);
        border-color: var(--ride);
      }

      .link.is-on.hostile .badge {
        background: var(--hostile);
        border-color: var(--hostile);
      }

      /* 缝隙行的文字说明 */

      .pair-note {
        font-size: 12px;
        color: var(--text-3);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition: color 0.24s ease, opacity 0.28s ease;
      }

      .pair-note.is-dim {
        opacity: 0.25;
      }

      .pair-note.is-on {
        color: var(--text-1);
      }

      /* ---------- 说明面板 ---------- */

      .panel {
        margin-top: 28px;
        padding: 16px 18px;
        border: 1px solid var(--divider);
        border-radius: 8px;
        background: var(--bg-soft);
        min-height: 112px;
      }

      .panel-title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .panel-line {
        font-size: 13px;
        color: var(--text-2);
        margin: 4px 0;
      }

      .panel-line b {
        color: var(--text-1);
      }

      .panel-line .k {
        display: inline-block;
        min-width: 3.4em;
        color: var(--text-3);
      }

      .panel-evidence {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--divider);
        font-size: 12px;
        color: var(--text-3);
      }

      .chip {
        display: inline-block;
        font-size: 11px;
        line-height: 1;
        padding: 3px 7px;
        border-radius: 4px;
        margin-right: 6px;
      }

      .chip.support {
        background: var(--support-soft);
        color: var(--support);
      }

      .chip.ride {
        background: var(--ride-soft);
        color: var(--ride);
      }

      .chip.hostile {
        background: var(--hostile-soft);
        color: var(--hostile);
      }

      @media (max-width: 720px) {
        :root {
          --label-w: 3rem;
          --rail-w: 66px;
          --line-x: 28px;
          --glyph-w: 108px;
        }

        body {
          padding: 24px 16px 56px;
        }

        .row {
          column-gap: 10px;
        }

        .yao-text {
          display: none;
        }

        .row.yao {
          grid-template-columns: var(--label-w) var(--rail-w) 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="wrap" v-cloak>
      <h1>爻的「比」：谁与谁相邻，关系如何</h1>
      <p class="lede">
        「比」只看<b>相邻</b>两爻。六爻自下而上共五对相邻：初二、二三、三四、四五、五上。一阴一阳则相比有情，再分承与乘；同阴或同阳则为敌比。
      </p>
      <p class="footnote">
        术语小注：严格讲相邻即称「比」。此处按通行讲法，把一阴一阳称「相比」（下阴承上阳为承，上阴乘下阳为乘），同性相邻称「敌比」。
      </p>

      <div class="switcher">
        <button
          v-for="(h, i) in hexagrams"
          :key="h.num"
          :class="{ 'is-on': i === current }"
          @click="selectHex(i)"
        >
          {{ h.symbol }} {{ h.full }}
          <span class="tag">{{ h.tagline }}</span>
        </button>
      </div>

      <div class="hex-head">
        <div class="hex-symbol">{{ hex.symbol }}</div>
        <div>
          <div class="hex-title">{{ hex.num }} · {{ hex.full }}</div>
          <div class="hex-guaci">{{ hex.guaCi }}</div>
        </div>
      </div>

      <div class="toolbar">
        <button class="play-btn" @click="togglePlay">
          {{ playing ? '暂停演示' : '逐对演示' }}
        </button>
        <div class="legend">
          <span><i class="support"></i>承（柔承刚，多顺）</span>
          <span><i class="ride"></i>乘（柔乘刚，多逆）</span>
          <span><i class="hostile"></i>敌比（同性不相得）</span>
        </div>
      </div>

      <div class="board">
        <template v-for="row in rows" :key="row.key">
          <div
            v-if="row.type === 'yao'"
            class="row yao"
            :class="yaoClass(row.i)"
            role="button"
            tabindex="0"
            :aria-label="'查看 ' + row.yao.label + ' 与上下邻爻的比'"
            @mouseenter="onHover(row.i)"
            @mouseleave="onHover(null)"
            @focus="onHover(row.i)"
            @blur="onHover(null)"
            @click="pinYao(row.i)"
            @keydown.enter.prevent="pinYao(row.i)"
            @keydown.space.prevent="pinYao(row.i)"
          >
            <div class="label">{{ row.yao.label }}</div>
            <div class="rail"></div>
            <div class="glyph">
              <span class="bar"></span>
              <span v-if="!row.yao.yang" class="bar"></span>
            </div>
            <div class="yao-text">{{ row.yao.text }}</div>
          </div>

          <div v-else class="row gap">
            <div></div>
            <div class="rail">
              <div
                class="link"
                :class="[row.pair.kind, pairClass(row.pair.index)]"
              >
                <span class="line"></span>
                <span class="arm top"></span>
                <span class="arm bottom"></span>
                <span
                  class="badge"
                  role="button"
                  tabindex="0"
                  :aria-label="'锁定 ' + row.pair.title + ' 这一对'"
                  @click.stop="pinPair(row.pair.index)"
                  @keydown.enter.prevent="pinPair(row.pair.index)"
                  @keydown.space.prevent="pinPair(row.pair.index)"
                >
                  {{ row.pair.badge }}
                </span>
              </div>
            </div>
            <div class="pair-note" :class="pairClass(row.pair.index)">
              {{ row.pair.title }} —— {{ row.pair.short }}
            </div>
          </div>
        </template>
      </div>

      <div class="panel">
        <template v-if="focusPair">
          <div class="panel-title">
            <span class="chip" :class="focusPair.kind">{{ focusPair.badge }}</span>
            {{ focusPair.title }}
          </div>
          <div class="panel-line">{{ focusPair.desc }}</div>
          <div v-if="focusPair.evidence" class="panel-evidence">
            原文佐证：{{ focusPair.evidence }}
          </div>
        </template>

        <template v-else-if="focusYao">
          <div class="panel-title">
            {{ focusYao.label }}（{{ focusYao.yang ? '阳' : '阴' }}）的比
          </div>
          <div class="panel-line">
            <span class="k">下邻</span>
            <template v-if="lowerPair">
              <span class="chip" :class="lowerPair.kind">{{ lowerPair.badge }}</span>
              <b>{{ hex.yao[focusYaoIndex - 1].label }}</b> —— {{ lowerPair.short }}
            </template>
            <template v-else>初爻在最下，无下邻可比。</template>
          </div>
          <div class="panel-line">
            <span class="k">上邻</span>
            <template v-if="upperPair">
              <span class="chip" :class="upperPair.kind">{{ upperPair.badge }}</span>
              <b>{{ hex.yao[focusYaoIndex + 1].label }}</b> —— {{ upperPair.short }}
            </template>
            <template v-else>上爻在最上，无上邻可比。</template>
          </div>
        </template>

        <template v-else>
          <div class="panel-title">{{ summary }}</div>
          <div class="panel-line">
            鼠标移到任一爻上（或点击固定）即可只看该爻与上下邻爻的比；点连接件上的徽章可锁定单独一对；「逐对演示」从初二到五上依次点亮。
          </div>
        </template>
      </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script>
      if (!window.Vue) {
        document.write(
          '<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"><\/script>'
        );
      }
    </script>
    <script>
      const { createApp, ref, computed, onUnmounted } = Vue;

      // 爻的阴阳由爻题推出：「九」为阳，「六」为阴
      const isYang = (label) => label.includes("九");

      // 爻辞与小象取自 docs/.vitepress/theme/config/liuShiSiGuaJingZhuan.json
      const raw = [
        {
          num: 3,
          name: "屯",
          full: "水雷屯",
          symbol: "䷂",
          tagline: "有比有敌比",
          guaCi: "屯：元亨，利贞，勿用有攸往，利建侯。",
          // 自下而上
          yao: [
            ["初九", "磐桓；利居贞，利建侯。"],
            ["六二", "屯如邅如，乘马班如。匪寇婚媾，女子贞不字，十年乃字。"],
            ["六三", "即鹿无虞，惟入于林中，君子几不如舍，往吝。"],
            ["六四", "乘马班如，求婚媾，往吉，无不利。"],
            ["九五", "屯其膏，小贞吉，大贞凶。"],
            ["上六", "乘马班如，泣血涟如。"],
          ],
          evidence: {
            0: "《小象传》释六二：「六二之难，乘刚也。」正指六二以柔乘初九之刚。",
          },
        },
        {
          num: 63,
          name: "既济",
          full: "水火既济",
          symbol: "䷾",
          tagline: "阴阳全交错，五对全比",
          guaCi: "既济：亨，小利贞，初吉终乱。",
          yao: [
            ["初九", "曳其轮，濡其尾，无咎。"],
            ["六二", "妇丧其茀，勿逐，七日得。"],
            ["九三", "高宗伐鬼方，三年克之，小人勿用。"],
            ["六四", "繻有衣袽，终日戒。"],
            ["九五", "东邻杀牛，不如西邻之禴祭，实受其福。"],
            ["上六", "濡其首，厉。"],
          ],
          evidence: {},
        },
        {
          num: 1,
          name: "乾",
          full: "乾为天",
          symbol: "䷀",
          tagline: "六爻纯阳，五对全敌比",
          guaCi: "乾：元亨，利贞。",
          yao: [
            ["初九", "潜龙，勿用。"],
            ["九二", "见龙在田，利见大人。"],
            ["九三", "君子终日乾乾，夕惕若，厉，无咎。"],
            ["九四", "或跃在渊，无咎。"],
            ["九五", "飞龙在天，利见大人。"],
            ["上九", "亢龙有悔。"],
          ],
          evidence: {},
        },
      ];

      const hexagrams = raw.map((h) => ({
        ...h,
        yao: h.yao.map(([label, text]) => ({
          label,
          text,
          yang: isYang(label),
        })),
      }));

      // 五对相邻：pair[i] 连接 yao[i]（下）与 yao[i+1]（上）
      function buildPairs(hex) {
        const out = [];
        for (let i = 0; i < 5; i++) {
          const lower = hex.yao[i];
          const upper = hex.yao[i + 1];
          const evidence = hex.evidence[i] || "";

          if (lower.yang === upper.yang) {
            const xing = lower.yang ? "阳" : "阴";
            out.push({
              index: i,
              kind: "hostile",
              badge: "敌比",
              title: `${lower.label} 与 ${upper.label}`,
              short: `同为${xing}爻，敌比`,
              desc: `${lower.label}与${upper.label}虽相邻，却同为${xing}爻。同性无情、不相得，故不成比而为敌比。`,
              evidence,
            });
          } else if (lower.yang) {
            // 下阳上阴：上面的阴爻乘下面的阳爻
            out.push({
              index: i,
              kind: "ride",
              badge: "乘",
              title: `${upper.label} 乘 ${lower.label}`,
              short: "阴居阳上，柔乘刚",
              desc: `${upper.label}为阴而居${lower.label}之上，是以柔乘刚。乘刚者逆势，多见艰阻。`,
              evidence,
            });
          } else {
            // 下阴上阳：下面的阴爻承上面的阳爻
            out.push({
              index: i,
              kind: "support",
              badge: "承",
              title: `${lower.label} 承 ${upper.label}`,
              short: "阴居阳下，柔承刚",
              desc: `${lower.label}为阴而居${upper.label}之下，是以柔承刚。承刚者顺势，多得亲辅。`,
              evidence,
            });
          }
        }
        return out;
      }

      createApp({
        setup() {
          const current = ref(0);
          const hoverYao = ref(null);
          const pinnedYao = ref(null);
          const pinnedPair = ref(null);
          const playing = ref(false);
          const step = ref(0);

          let timer = null;

          const hex = computed(() => hexagrams[current.value]);
          const pairs = computed(() => buildPairs(hex.value));

          // 自上而下渲染：上爻在顶、初爻在底，爻行之间插入缝隙行放连接件
          const rows = computed(() => {
            const out = [];
            for (let i = 5; i >= 0; i--) {
              out.push({ type: "yao", key: `y${i}`, i, yao: hex.value.yao[i] });
              if (i > 0) {
                out.push({
                  type: "gap",
                  key: `g${i - 1}`,
                  pair: pairs.value[i - 1],
                });
              }
            }
            return out;
          });

          const focus = computed(() => {
            if (playing.value) return { type: "pair", index: step.value };
            if (pinnedPair.value !== null)
              return { type: "pair", index: pinnedPair.value };
            if (pinnedYao.value !== null)
              return { type: "yao", index: pinnedYao.value };
            if (hoverYao.value !== null)
              return { type: "yao", index: hoverYao.value };
            return null;
          });

          const focusPair = computed(() =>
            focus.value && focus.value.type === "pair"
              ? pairs.value[focus.value.index]
              : null
          );

          const focusYaoIndex = computed(() =>
            focus.value && focus.value.type === "yao" ? focus.value.index : -1
          );

          const focusYao = computed(() =>
            focusYaoIndex.value >= 0 ? hex.value.yao[focusYaoIndex.value] : null
          );

          const lowerPair = computed(() =>
            focusYaoIndex.value > 0 ? pairs.value[focusYaoIndex.value - 1] : null
          );

          const upperPair = computed(() =>
            focusYaoIndex.value >= 0 && focusYaoIndex.value < 5
              ? pairs.value[focusYaoIndex.value]
              : null
          );

          const summary = computed(() => {
            const bi = pairs.value.filter((p) => p.kind !== "hostile");
            if (!bi.length) return "本卦五对相邻全是敌比，无一对相比。";
            const cheng = bi.filter((p) => p.kind === "support").length;
            const ride = bi.filter((p) => p.kind === "ride").length;
            return `本卦五对相邻中，${bi.length} 对相比（承 ${cheng}、乘 ${ride}），${
              5 - bi.length
            } 对敌比。`;
          });

          function yaoClass(i) {
            const f = focus.value;
            if (!f) return "";
            if (f.type === "pair") {
              return i === f.index || i === f.index + 1 ? "is-self" : "is-dim";
            }
            if (i === f.index) return "is-self";
            if (i === f.index - 1 || i === f.index + 1) return "is-neighbor";
            return "is-dim";
          }

          function pairClass(p) {
            const f = focus.value;
            if (!f) return "";
            if (f.type === "pair") return p === f.index ? "is-on" : "is-dim";
            return p === f.index - 1 || p === f.index ? "is-on" : "is-dim";
          }

          function stop() {
            playing.value = false;
            if (timer) {
              clearTimeout(timer);
              timer = null;
            }
          }

          function tick() {
            timer = setTimeout(() => {
              if (step.value >= 4) {
                const last = step.value;
                stop();
                pinnedPair.value = last;
                return;
              }
              step.value += 1;
              tick();
            }, 1300);
          }

          function togglePlay() {
            if (playing.value) {
              const last = step.value;
              stop();
              pinnedPair.value = last;
              return;
            }
            pinnedYao.value = null;
            pinnedPair.value = null;
            hoverYao.value = null;
            step.value = 0;
            playing.value = true;
            tick();
          }

          function onHover(i) {
            if (playing.value) return;
            hoverYao.value = i;
          }

          function pinYao(i) {
            stop();
            pinnedPair.value = null;
            pinnedYao.value = pinnedYao.value === i ? null : i;
          }

          function pinPair(p) {
            stop();
            pinnedYao.value = null;
            hoverYao.value = null;
            pinnedPair.value = pinnedPair.value === p ? null : p;
          }

          function selectHex(i) {
            stop();
            current.value = i;
            pinnedYao.value = null;
            pinnedPair.value = null;
            hoverYao.value = null;
            step.value = 0;
          }

          onUnmounted(stop);

          return {
            hexagrams,
            current,
            hex,
            rows,
            playing,
            focusPair,
            focusYao,
            focusYaoIndex,
            lowerPair,
            upperPair,
            summary,
            yaoClass,
            pairClass,
            onHover,
            togglePlay,
            pinYao,
            pinPair,
            selectHex,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
